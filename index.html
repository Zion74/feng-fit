<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<meta name="theme-color" content="#f4f7f1" />
<title>冯总减脂 · 全流程</title>
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="FENG·FIT">
<meta name="mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..48,600;12..48,700;12..48,800&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:oklch(0.984 0.008 145); --surface:oklch(0.998 0.004 145); --surface-2:oklch(0.963 0.012 148);
  --ink:oklch(0.27 0.024 158); --ink-2:oklch(0.46 0.020 158); --ink-3:oklch(0.62 0.014 158);
  --line:oklch(0.905 0.012 152); --line-2:oklch(0.85 0.014 152);
  --pine:oklch(0.50 0.097 159); --pine-d:oklch(0.40 0.088 159); --pine-soft:oklch(0.945 0.034 158); --pine-mid:oklch(0.74 0.075 158);
  --clay:oklch(0.66 0.135 52); --clay-d:oklch(0.55 0.135 48); --clay-soft:oklch(0.945 0.045 66);
  --danger:oklch(0.565 0.16 28); --danger-soft:oklch(0.93 0.052 32);
  --amber:oklch(0.80 0.12 80); --amber-soft:oklch(0.95 0.055 86);
  --blue:oklch(0.55 0.10 235); --blue-soft:oklch(0.94 0.04 232);
  --shadow-sm:0 1px 2px oklch(0.42 0.03 158 /.07),0 1px 1px oklch(0.42 0.03 158 /.05);
  --shadow-md:0 6px 22px oklch(0.42 0.04 158 /.10); --shadow-lg:0 16px 44px oklch(0.40 0.05 158 /.16);
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;--s7:48px;
  --r-sm:9px;--r-md:15px;--r-lg:22px;--r-xl:28px;--r-full:999px;
  --font-cjk:'Noto Sans SC',system-ui,-apple-system,sans-serif;
  --font-num:'Bricolage Grotesque','Noto Sans SC',sans-serif; --maxw:480px;
}
*{box-sizing:border-box;margin:0;padding:0;}
html{-webkit-text-size-adjust:100%;}
body{font-family:var(--font-cjk);background:var(--bg);color:var(--ink);line-height:1.55;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;overscroll-behavior-y:none;}
.num{font-family:var(--font-num);font-feature-settings:"tnum" 1;letter-spacing:-.01em;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
input,textarea,select{font-family:inherit;font-size:16px;color:inherit;}
:focus-visible{outline:2.5px solid var(--pine);outline-offset:2px;border-radius:6px;}
svg{flex-shrink:0;}
.lbl svg{width:15px;height:15px;}
.empty .ic svg{width:100%;height:100%;}

.app{max-width:var(--maxw);margin-inline:auto;min-height:100dvh;position:relative;background:var(--bg);box-shadow:0 0 0 1px var(--line);}
@media(min-width:520px){.app{box-shadow:var(--shadow-lg);}}

.topbar{position:sticky;top:0;z-index:30;background:color-mix(in oklch,var(--bg) 86%,transparent);backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid var(--line);padding:calc(var(--s3) + env(safe-area-inset-top)) var(--s5) var(--s3);display:flex;align-items:center;justify-content:space-between;gap:var(--s3);}
.brand{display:flex;align-items:baseline;gap:var(--s2);}
.brand b{font-family:var(--font-num);font-weight:800;font-size:18px;letter-spacing:-.02em;color:var(--pine-d);}
.brand span{font-size:11.5px;color:var(--ink-3);font-weight:500;}
.tbar-r{display:flex;align-items:center;gap:var(--s3);}
.rolechip{font-size:11px;font-weight:700;padding:4px 10px;border-radius:var(--r-full);letter-spacing:.02em;}
.rolechip.user{background:var(--pine-soft);color:var(--pine-d);}
.rolechip.coach{background:var(--clay-soft);color:var(--clay-d);}
.gear{width:34px;height:34px;border-radius:var(--r-full);display:grid;place-items:center;color:var(--ink-2);background:var(--surface-2);}
.gear svg{width:18px;height:18px;}

main{padding:var(--s5) var(--s5) calc(94px + env(safe-area-inset-bottom));}
.view{display:none;animation:rise .42s cubic-bezier(.16,1,.3,1);}
.view.on{display:block;}
@keyframes rise{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
@media(prefers-reduced-motion:reduce){.view{animation:none;}*{transition:none!important;}}

.eyebrow{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--pine);}
.eyebrow.clay{color:var(--clay-d);}
h2.title{font-size:25px;font-weight:900;letter-spacing:-.02em;line-height:1.15;margin-top:var(--s1);}
.sub{color:var(--ink-2);font-size:13.5px;margin-top:6px;}
.section-h{display:flex;align-items:center;gap:var(--s3);margin:var(--s6) 0 var(--s3);}
.section-h h3{font-size:15px;font-weight:700;white-space:nowrap;}
.section-h .ln{height:1px;flex:1;background:var(--line);}
.section-h .meta{font-size:12px;color:var(--ink-3);}

.today-head{display:flex;align-items:flex-end;justify-content:space-between;gap:var(--s3);}
.planpill{display:inline-flex;align-items:center;gap:7px;padding:6px 12px 6px 9px;border-radius:var(--r-full);font-size:12.5px;font-weight:700;background:var(--pine-soft);color:var(--pine-d);}
.planpill.rest{background:var(--surface-2);color:var(--ink-2);}
.planpill .g{width:18px;height:18px;border-radius:7px;background:var(--pine);color:#fff;display:grid;place-items:center;font-size:11px;font-weight:800;font-family:var(--font-num);}
.planpill.rest .g{background:var(--ink-3);}

.weight-card{margin-top:var(--s4);background:radial-gradient(120% 90% at 100% 0%,var(--pine-soft) 0%,transparent 55%),var(--surface);border:1px solid var(--line);border-radius:var(--r-xl);padding:var(--s5) var(--s5) var(--s4);box-shadow:var(--shadow-sm);}
.weight-card .lbl{font-size:12.5px;font-weight:600;color:var(--ink-2);display:flex;align-items:center;gap:6px;}
.stepper{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);margin-top:var(--s2);}
.stepper button{width:54px;height:54px;border-radius:var(--r-md);background:var(--surface);border:1px solid var(--line-2);display:grid;place-items:center;color:var(--pine-d);transition:transform .12s,background .15s;box-shadow:var(--shadow-sm);}
.stepper button:active{transform:scale(.92);background:var(--pine-soft);}
.stepper button svg{width:22px;height:22px;}
.wval{display:flex;align-items:baseline;gap:6px;}
.wval input{width:140px;border:none;background:none;text-align:center;font-family:var(--font-num);font-weight:800;font-size:58px;line-height:1;letter-spacing:-.03em;color:var(--ink);padding:0;}
.wval input::-webkit-outer-spin-button,.wval input::-webkit-inner-spin-button{-webkit-appearance:none;}
.wval .u{font-size:17px;font-weight:700;color:var(--ink-3);font-family:var(--font-num);}
.wdelta{text-align:center;margin-top:var(--s2);font-size:12.5px;color:var(--ink-2);min-height:18px;}
.wdelta b{font-family:var(--font-num);color:var(--pine-d);}

.field{margin-top:var(--s4);}
.field>.lbl{font-size:13px;font-weight:600;color:var(--ink-2);margin-bottom:var(--s2);display:flex;align-items:center;gap:7px;}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;background:var(--surface-2);padding:5px;border-radius:var(--r-md);}
.seg.four{grid-template-columns:repeat(4,1fr);grid-auto-flow:row;}
.seg label{position:relative;}
.seg input{position:absolute;opacity:0;pointer-events:none;}
.seg span{display:block;text-align:center;padding:10px 4px;border-radius:10px;font-size:13.5px;font-weight:600;color:var(--ink-2);transition:all .16s ease;}
.seg input:checked + span{background:var(--surface);color:var(--pine-d);box-shadow:var(--shadow-sm);font-weight:700;}
.seg.alert input:checked + span.bad{background:var(--danger);color:#fff;}
.seg.alert input:checked + span.warn{background:var(--amber);color:oklch(0.34 0.06 70);}
.seg.good input:checked + span.best{background:var(--pine);color:#fff;}

.mini-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:var(--s3);margin-top:var(--s4);}
.mini{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:var(--s3);text-align:center;}
.mini .lbl{font-size:11.5px;color:var(--ink-3);font-weight:600;}
.mini .ipt{display:flex;align-items:baseline;justify-content:center;gap:3px;margin-top:3px;}
.mini input{width:100%;border:none;background:none;text-align:center;font-family:var(--font-num);font-weight:700;font-size:23px;color:var(--ink);}
.mini .u{font-size:11px;color:var(--ink-3);font-weight:600;}

textarea.note{width:100%;margin-top:var(--s4);border:1px solid var(--line);background:var(--surface);border-radius:var(--r-md);padding:var(--s3) var(--s4);resize:none;min-height:54px;font-size:14.5px;line-height:1.5;}
textarea.note::placeholder{color:var(--ink-3);}

.submit{width:100%;margin-top:var(--s5);padding:17px;border-radius:var(--r-lg);background:var(--clay);color:#fff;font-size:16px;font-weight:700;letter-spacing:.02em;box-shadow:0 8px 20px oklch(0.66 0.135 52 /.28);transition:transform .14s,filter .15s;display:flex;align-items:center;justify-content:center;gap:9px;}
.submit:active{transform:translateY(1px) scale(.99);filter:brightness(.97);}
.submit.done{background:var(--pine);box-shadow:0 8px 20px oklch(0.50 0.097 159 /.26);}
.submit svg{width:19px;height:19px;}
.saved-banner{display:flex;align-items:center;gap:var(--s3);background:var(--pine-soft);color:var(--pine-d);padding:var(--s3) var(--s4);border-radius:var(--r-md);font-size:13.5px;font-weight:600;margin-top:var(--s4);}
.saved-banner svg{width:18px;height:18px;flex-shrink:0;}

/* —— diet log —— */
.diet-card{margin-top:var(--s4);background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:var(--s4);box-shadow:var(--shadow-sm);}
.diet-card .hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--s3);}
.diet-card .hd h3{font-size:14.5px;font-weight:700;}
.diet-card .hd .day{font-size:11.5px;font-weight:600;color:var(--ink-3);}
.mbar{margin-bottom:var(--s3);}
.mbar .row{display:flex;align-items:baseline;justify-content:space-between;font-size:12px;margin-bottom:5px;}
.mbar .row .k{font-weight:600;color:var(--ink-2);}
.mbar .row .v{font-family:var(--font-num);font-weight:700;color:var(--ink);}
.mbar .row .v small{color:var(--ink-3);font-weight:600;}
.mbar .track{height:8px;border-radius:var(--r-full);background:var(--surface-2);overflow:hidden;}
.mbar .track i{display:block;height:100%;border-radius:var(--r-full);transition:width .6s cubic-bezier(.16,1,.3,1);}
.mbar.carb .track i{background:var(--pine);}
.mbar.prot .track i{background:var(--blue);}
.mbar .track i.over{background:var(--clay)!important;}
.kcal{margin-top:var(--s3);padding-top:var(--s3);border-top:1px dashed var(--line);font-size:13px;color:var(--ink-2);font-weight:600;}
.kcal b{font-family:var(--font-num);font-size:17px;color:var(--clay-d);}
.kcal span{font-size:11px;color:var(--ink-3);font-weight:500;}
.foodlist{margin-top:var(--s2);}
.fitem{display:flex;align-items:center;gap:var(--s3);padding:var(--s3) 0;border-top:1px solid var(--line);}
.fitem .fn{flex:1;font-size:14px;font-weight:500;}
.fitem .fn small{color:var(--ink-3);font-weight:400;}
.fitem .fm{font-family:var(--font-num);font-size:12px;font-weight:600;color:var(--ink-2);text-align:right;}
.fitem .fm b{color:var(--pine-d);}
.fitem .fm .p{color:var(--blue);}
.fitem .del{width:28px;height:28px;border-radius:var(--r-full);display:grid;place-items:center;color:var(--ink-3);background:var(--surface-2);}
.fitem .del svg{width:14px;height:14px;}
.addfood{width:100%;margin-top:var(--s3);padding:13px;border-radius:var(--r-md);background:var(--pine-soft);color:var(--pine-d);font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:7px;}
.addfood svg{width:17px;height:17px;}
.diet-empty{text-align:center;padding:var(--s4) 0 var(--s2);color:var(--ink-3);font-size:13px;}
.diet-link{display:flex;align-items:center;justify-content:space-between;margin-top:var(--s4);background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:var(--s4) var(--s5);box-shadow:var(--shadow-sm);cursor:pointer;transition:transform .12s;}
.diet-link:active{transform:scale(.99);}
.diet-link .l .k{font-size:12px;color:var(--ink-2);font-weight:600;}
.diet-link .l .v{font-family:var(--font-num);font-weight:800;font-size:19px;margin-top:3px;}
.diet-link .l .v .c{color:var(--pine-d);}.diet-link .l .v .p{color:var(--blue);}
.diet-link .l .v small{font-family:var(--font-cjk);font-size:11px;color:var(--ink-3);font-weight:600;}
.diet-link .arrow{display:flex;align-items:center;gap:3px;font-size:13px;font-weight:700;color:var(--pine-d);white-space:nowrap;}
.diet-link .arrow svg{width:15px;height:15px;}
.meal{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:var(--s4);margin-top:var(--s3);box-shadow:var(--shadow-sm);}
.meal .mh{display:flex;align-items:flex-start;justify-content:space-between;gap:var(--s3);}
.meal .mh .nm{font-size:15.5px;font-weight:700;}
.meal .tgt{font-family:var(--font-num);font-size:12.5px;font-weight:700;color:var(--ink-2);text-align:right;line-height:1.45;}
.meal .tgt b.c{color:var(--pine-d);}.meal .tgt b.p{color:var(--blue);}
.meal .tgt .cur{font-size:10.5px;color:var(--ink-3);font-weight:600;margin-top:1px;}
.meal .hint{font-size:12px;color:oklch(0.42 0.08 60);margin-top:8px;background:var(--clay-soft);padding:8px 11px;border-radius:var(--r-sm);}
.meal .mfoods{margin-top:var(--s1);}
.meal .addf{width:100%;margin-top:var(--s2);padding:10px;border-radius:var(--r-sm);background:var(--pine-soft);color:var(--pine-d);font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px;}
.meal .addf svg{width:15px;height:15px;}
.diet-foot{font-size:12px;color:var(--ink-3);text-align:center;margin-top:var(--s4);padding:0 var(--s4);line-height:1.6;}
.tip{margin-top:var(--s4);background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:var(--s4);cursor:pointer;box-shadow:var(--shadow-sm);transition:transform .12s;}
.tip:active{transform:scale(.99);}
.tip-h{font-size:11.5px;font-weight:700;color:var(--clay-d);letter-spacing:.03em;}
.tip-b{font-size:13.5px;color:var(--ink);line-height:1.6;margin-top:6px;}
.tip-n{font-size:11px;color:var(--ink-3);font-weight:600;margin-top:8px;}

/* —— plan —— */
.switch{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--surface-2);padding:5px;border-radius:var(--r-md);margin-top:var(--s4);position:sticky;top:calc(54px + env(safe-area-inset-top));z-index:10;}
.switch button{padding:9px;border-radius:10px;font-size:13.5px;font-weight:600;color:var(--ink-2);transition:all .15s;}
.switch button.on{background:var(--surface);color:var(--pine-d);font-weight:700;box-shadow:var(--shadow-sm);}
.ex{display:flex;align-items:center;gap:var(--s3);padding:var(--s3) 0;border-bottom:1px solid var(--line);}
.ex:last-child{border-bottom:none;}
.ex .n{font-family:var(--font-num);font-weight:700;font-size:13px;color:var(--pine);width:22px;flex-shrink:0;}
.ex .nm{flex:1;font-size:14.5px;font-weight:500;}
.ex .nm small{display:block;font-size:11.5px;color:var(--ink-3);font-weight:400;margin-top:1px;}
.ex .tg{font-family:var(--font-num);font-size:12.5px;font-weight:600;color:var(--ink-2);background:var(--surface-2);padding:3px 9px;border-radius:var(--r-full);white-space:nowrap;}
.core-note{background:var(--clay-soft);border-radius:var(--r-md);padding:var(--s3) var(--s4);font-size:12.5px;color:oklch(0.42 0.08 60);margin-bottom:var(--s2);display:flex;gap:9px;align-items:flex-start;}
.core-note svg{width:17px;height:17px;flex-shrink:0;margin-top:2px;}
.macro{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s2);margin:var(--s2) 0;}
.macro .m{background:var(--pine-soft);border-radius:var(--r-sm);padding:var(--s3) var(--s2);text-align:center;}
.macro .m.rest{background:var(--surface-2);}
.macro .m b{display:block;font-family:var(--font-num);font-size:21px;font-weight:800;color:var(--pine-d);}
.macro .m span{font-size:11px;color:var(--ink-2);}
.acc{border:1px solid var(--line);border-radius:var(--r-md);margin-top:var(--s3);overflow:hidden;background:var(--surface);}
.acc summary{list-style:none;padding:var(--s4);display:flex;align-items:center;justify-content:space-between;cursor:pointer;font-weight:600;font-size:14.5px;}
.acc summary::-webkit-details-marker{display:none;}
.acc summary .chev{transition:transform .25s;color:var(--ink-3);}
.acc[open] summary .chev{transform:rotate(90deg);}
.acc .body{padding:0 var(--s4) var(--s4);font-size:13.5px;color:var(--ink-2);}
.qlist{display:flex;flex-direction:column;gap:var(--s2);}
.qrow{display:flex;gap:var(--s3);padding:var(--s2) 0;border-top:1px dashed var(--line);}
.qrow .k{font-weight:700;flex-shrink:0;min-width:74px;font-size:13px;}
.qrow .v{color:var(--ink-2);font-size:13px;}
.warnbox{background:var(--danger-soft);border-radius:var(--r-md);padding:var(--s4);margin-top:var(--s3);}
.warnbox h4{font-size:13.5px;color:var(--danger);display:flex;align-items:center;gap:7px;margin-bottom:var(--s2);}
.warnbox h4 svg{width:17px;height:17px;}
.warnbox p{font-size:13px;color:oklch(0.40 0.08 30);margin-top:var(--s1);}
.warnbox .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:var(--s2);}
.warnbox .tags span{font-size:12px;background:var(--surface);color:var(--danger);padding:4px 9px;border-radius:var(--r-full);font-weight:600;}

/* —— progress —— */
.hero{background:radial-gradient(130% 110% at 0% 0%,var(--pine-soft) 0%,transparent 50%),var(--surface);border:1px solid var(--line);border-radius:var(--r-xl);padding:var(--s5);box-shadow:var(--shadow-sm);margin-top:var(--s4);}
.hero .top{display:flex;align-items:flex-start;justify-content:space-between;}
.hero .now .k{font-size:12.5px;color:var(--ink-2);font-weight:600;}
.hero .now .w{display:flex;align-items:baseline;gap:6px;margin-top:2px;}
.hero .now .w b{font-family:var(--font-num);font-size:46px;font-weight:800;letter-spacing:-.03em;line-height:1;}
.hero .now .w span{font-size:15px;color:var(--ink-3);font-weight:700;font-family:var(--font-num);}
.lost{text-align:right;}
.lost .big{font-family:var(--font-num);font-size:27px;font-weight:800;color:var(--pine-d);line-height:1;}
.lost .k{font-size:11.5px;color:var(--ink-2);font-weight:600;margin-top:3px;}
.lost.up .big{color:var(--clay-d);}
.prog{margin-top:var(--s4);}
.prog .bar{height:9px;border-radius:var(--r-full);background:var(--surface-2);overflow:hidden;}
.prog .bar i{display:block;height:100%;border-radius:var(--r-full);background:var(--pine);transition:width .9s cubic-bezier(.16,1,.3,1);}
.prog .lab{display:flex;justify-content:space-between;margin-top:7px;font-size:11.5px;color:var(--ink-3);font-weight:600;}
.prog .lab b{color:var(--ink-2);font-family:var(--font-num);}
.chartwrap{margin-top:var(--s4);background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:var(--s4) var(--s3) var(--s3);box-shadow:var(--shadow-sm);}

const WK=['周日','周一','周二','周三','周四','周五','周六'];
function planForDate(ds){
  const d=parseD(ds),wd=d.getDay(); if(![1,3,5].includes(wd))return{type:'休息'};
  let n=0,cur=parseD(state.cfg.profile.start_date); if(d<cur)return{type:'休息'};
  while(cur<=d){if([1,3,5].includes(cur.getDay()))n++;cur.setDate(cur.getDate()+1);} return{type:n%2===1?'A':'B'};
}

/* ============ AI 记录（语音 / 拍照 → step-3.7-flash 按松松营养率换算） ============ */
function blobToB64(blob){return new Promise(res=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]);r.readAsDataURL(blob);});}
function fileToDataURL(file){return new Promise(res=>{const r=new FileReader();r.onload=()=>res(r.result);r.readAsDataURL(file);});}
async function compressImage(file,max=1024,q=0.82){
  const durl=await fileToDataURL(file);
  return new Promise(res=>{const img=new Image();img.onload=()=>{let w=img.width,h=img.height;if(w>max||h>max){if(w>=h){h=Math.round(h*max/w);w=max;}else{w=Math.round(w*max/h);h=max;}}const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);try{res(c.toDataURL('image/jpeg',q));}catch(e){res(durl);}};img.onerror=()=>res(durl);img.src=durl;});
}
let _rec=null,_chunks=[];
async function startVoice(){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){toast('此浏览器不支持录音，请用拍照或手动');return;}
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    _chunks=[];_rec=new MediaRecorder(stream);
    _rec.ondataavailable=e=>{if(e.data&&e.data.size)_chunks.push(e.data);};
    _rec.onstop=async()=>{stream.getTracks().forEach(t=>t.stop());const blob=new Blob(_chunks,{type:_rec.mimeType||'audio/webm'});const b64=await blobToB64(blob);callAI({kind:'audio',audio:b64,mime:_rec.mimeType,meal:state.sheet.meal});};
    _rec.start();state.sheet.mode='ai';state.sheet.aiStatus='recording';renderSheet();
  }catch(e){toast('需要麦克风权限才能语音记录');}
}
function stopVoice(){if(_rec&&_rec.state!=='inactive'){state.sheet.aiStatus='loading';renderSheet();_rec.stop();}}
function pickPhoto(){
  const inp=document.createElement('input');inp.type='file';inp.accept='image/*';inp.setAttribute('capture','environment');
  inp.onchange=async()=>{const f=inp.files&&inp.files[0];if(!f)return;state.sheet.mode='ai';state.sheet.aiStatus='loading';renderSheet();const img=await compressImage(f);callAI({kind:'image',image:img,meal:state.sheet.meal});};
  inp.click();
}
async function callAI(payload){
  if(!state.sheet)return;
  state.sheet.mode='ai';state.sheet.aiStatus='loading';state.sheet.ai=null;renderSheet();
  try{
    const r=await fetch(`${CONFIG.SUPABASE_URL}/functions/v1/diet-ai`,{method:'POST',headers:{'Content-Type':'application/json','apikey':CONFIG.SUPABASE_ANON_KEY,'Authorization':`Bearer ${CONFIG.SUPABASE_ANON_KEY}`},body:JSON.stringify(payload)});
    const j=await r.json();
    if(j.error){state.sheet.aiStatus='error';state.sheet.aiErr='AI 服务出错：'+j.error;}
    else if(!j.items||!j.items.length){state.sheet.aiStatus='error';state.sheet.aiErr=j.note||'没识别到食物，换种说法或手动添加';state.sheet.transcript=j.transcript||'';}
    else{state.sheet.aiStatus='done';state.sheet.ai=j;}
  }catch(e){state.sheet.aiStatus='error';state.sheet.aiErr='连接失败（AI 函数 diet-ai 可能还没部署）';}
  if(state.sheet)renderSheet();
}

function renderProgress(){
  const el=$('#view-progress'),P=state.cfg.profile,withW=state.rows.filter(r=>r.weight);
  if(!withW.length){el.innerHTML=`<div class="eyebrow">进度监看</div><h2 class="title">还没有数据</h2><div class="empty"><div class="ic">${I.spark}</div><h4>去「今日」记录第一天</h4><p>记录第一笔体重后，这里显示减脂旅程曲线。</p></div>`;return;}
  const latest=withW[withW.length-1].weight,lost=P.start_weight-latest,lostPct=lost/P.start_weight*100;
  const totalGoal=P.start_weight-P.target_weight,progPct=Math.max(0,Math.min(100,lost/totalGoal*100)),bmi=latest/Math.pow(P.height/100,2);
  const curWi=weekIndexOf(todayStr()),wAvg=weeklyAvg(curWi),pAvg=weeklyAvg(curWi-1),ppAvg=weeklyAvg(curWi-2);
  let wow=(wAvg&&pAvg)?(wAvg-pAvg)/pAvg*100:null,biweek=(wAvg&&ppAvg)?(wAvg-ppAvg)/ppAvg*100:null;
  const trainings=state.rows.filter(r=>weekIndexOf(r.log_date)===curWi&&r.training==='完成').length;
  let badge=biweek===null?'<span class="badge na">数据积累中</span>':(biweek<=-2?`<span class="badge ok">${I.check} 达标 ${biweek.toFixed(1)}%</span>`:`<span class="badge slow">偏慢 ${biweek>0?'+':''}${biweek.toFixed(1)}%</span>`);
  el.innerHTML=`<div class="eyebrow">进度监看</div><h2 class="title">减脂旅程</h2>
    <div class="hero"><div class="top"><div class="now"><div class="k">当前体重</div><div class="w"><b class="num">${latest.toFixed(1)}</b><span>kg</span></div></div>
      <div class="lost ${lost<0?'up':''}"><div class="big">${lost>=0?'−':'+'}${Math.abs(lost).toFixed(1)}</div><div class="k">已减 kg · ${Math.abs(lostPct).toFixed(1)}%</div></div></div>
      <div class="prog"><div class="bar"><i style="width:${progPct}%"></i></div><div class="lab"><span>起始 <b>${P.start_weight}</b></span><span>BMI <b>${bmi.toFixed(1)}</b></span><span>目标 <b>${P.target_weight}</b></span></div></div></div>
    <div class="chartwrap"><div class="ch-h"><div class="t">体重趋势</div><div class="lg"><span><i style="background:var(--pine)"></i>体重</span><span><i style="background:var(--clay)"></i>目标</span></div></div>${weightChart(withW)}</div>
    <div class="statgrid"><div class="stat"><div class="k">本周均重</div><div class="v num">${wAvg?wAvg.toFixed(1):'—'}<small> kg</small></div></div>
      <div class="stat"><div class="k">较上周</div><div class="v num">${wow!==null?(wow>0?'+':'')+wow.toFixed(1):'—'}<small> %</small></div></div>
      <div class="stat"><div class="k">2周达标 (-2%)</div>${badge}</div>
      <div class="stat"><div class="k">本周训练</div><div class="v num">${trainings}<small> 次</small></div></div></div>
    <div class="section-h"><h3>打卡记录</h3><div class="ln"></div><div class="meta">${withW.length} 天</div></div>
    <div class="hist">${[...state.rows].reverse().slice(0,30).map(histRow).join('')}</div>`;
}
function histRow(r){
  const d=parseD(r.log_date),tg=[];
  if(r.plan==='A')tg.push('<span class="tg-s A">A上肢</span>');else if(r.plan==='B')tg.push('<span class="tg-s B">B下肢</span>');
  if(r.training==='完成')tg.push('<span class="tg-s">✓训练</span>');else if(r.training==='未练')tg.push('<span class="tg-s warn">缺练</span>');
  if(r.carbs||r.protein)tg.push(`<span class="tg-s">饮食 ${Math.round(r.carbs||0)}碳/${Math.round(r.protein||0)}蛋</span>`);
  if(r.back==='明显')tg.push('<span class="tg-s bad">腰不适</span>');else if(r.back==='轻微')tg.push('<span class="tg-s warn">腰轻微</span>');
  return `<div class="hrow"><div class="d"><b class="num">${fmtMD(r.log_date)}</b><span>${WK[d.getDay()]}</span></div><div class="hw num">${r.weight?r.weight.toFixed(1):'—'}${r.weight?'<small> kg</small>':''}</div><div class="tags">${tg.join('')}</div></div>`;
}
function weightChart(pts){
  let data=pts.map(r=>({x:parseD(r.log_date).getTime(),y:r.weight}));const P=state.cfg.profile,sT=parseD(P.start_date).getTime();
  if(data[0].x>sT)data.unshift({x:sT,y:P.start_weight});
  const W=420,H=180,pl=8,pr=10,pt=14,pb=22,xs=data.map(d=>d.x),ys=data.map(d=>d.y).concat([P.target_weight]);
  const xmin=Math.min(...xs),xmax=Math.max(...xs)+86400000;let ymin=Math.min(...ys),ymax=Math.max(...ys);const yr=(ymax-ymin)||4;ymin-=yr*0.18;ymax+=yr*0.18;
  const X=v=>pl+(v-xmin)/((xmax-xmin)||1)*(W-pl-pr),Y=v=>pt+(ymax-v)/((ymax-ymin)||1)*(H-pt-pb);
  const line=data.map((d,i)=>`${i?'L':'M'}${X(d.x).toFixed(1)} ${Y(d.y).toFixed(1)}`).join(' ');
  const area=`${line} L${X(data[data.length-1].x).toFixed(1)} ${Y(ymin).toFixed(1)} L${X(data[0].x).toFixed(1)} ${Y(ymin).toFixed(1)} Z`,tY=Y(P.target_weight);
  let grid='';for(let g=0;g<3;g++){const yy=ymin+(ymax-ymin)*(g+1)/4,py=Y(yy);grid+=`<line x1="${pl}" y1="${py.toFixed(1)}" x2="${W-pr}" y2="${py.toFixed(1)}" stroke="var(--line)" stroke-width="1"/><text x="${W-pr}" y="${(py-3).toFixed(1)}" text-anchor="end" font-size="9" fill="var(--ink-3)" font-family="var(--font-num)">${yy.toFixed(0)}</text>`;}
  const dots=data.map(d=>`<circle cx="${X(d.x).toFixed(1)}" cy="${Y(d.y).toFixed(1)}" r="2.4" fill="var(--surface)" stroke="var(--pine)" stroke-width="2"/>`).join(''),last=data[data.length-1];
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--pine)" stop-opacity=".16"/><stop offset="1" stop-color="var(--pine)" stop-opacity="0"/></linearGradient></defs>
    ${grid}<line x1="${pl}" y1="${tY.toFixed(1)}" x2="${W-pr}" y2="${tY.toFixed(1)}" stroke="var(--clay)" stroke-width="1.6" stroke-dasharray="5 4"/>
    <text x="${pl+2}" y="${(tY-4).toFixed(1)}" font-size="9" fill="var(--clay-d)" font-weight="700" font-family="var(--font-num)">目标 ${P.target_weight}</text>
    <path d="${area}" fill="url(#ag)"/><path d="${line}" fill="none" stroke="var(--pine)" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>${dots}
    <circle cx="${X(last.x).toFixed(1)}" cy="${Y(last.y).toFixed(1)}" r="4.2" fill="var(--pine)" stroke="var(--surface)" stroke-width="2.5"/></svg>`;
}

/* ============ 设计（教练） ============ */
function renderDesign(){
  const P=state.cfg.profile,Q=state.cfg.quota,Pl=state.cfg.plan;
  const sug=suggest(P);
  $('#view-design').innerHTML=`<div class="eyebrow clay">教练模式</div><h2 class="title">方案设计</h2><p class="sub">改完点底部「保存方案」，冯总端会同步更新</p>
    <div class="dgroup"><h3>① 基本信息</h3><div class="dgrid">
      ${dfield('身高 cm','p_height',P.height)}${dfield('年龄','p_age',P.age)}
      ${dfield('起始体重 kg','p_sw',P.start_weight)}${dfield('目标体重 kg','p_tw',P.target_weight)}
      ${dfield('起始日期','p_sd',P.start_date,'date')}<div></div></div>
      <div class="calc">公式估算：基础代谢 <b>${sug.bmr}</b> · 应吃热量(力训日) <b>${sug.eat}</b> kcal<br>建议配额 力训日 碳<b>${sug.train.carb}</b>/蛋<b>${sug.train.protein}</b>/脂<b>${sug.train.fat}</b>，休息日 碳<b>${sug.rest.carb}</b>
        <br><button class="applybtn" id="applySug">套用建议配额 ↓</button></div></div>
    <div class="dgroup"><h3>② 每日配额</h3>
      <div class="qedit"><div></div><div class="hd">碳水g</div><div class="hd">蛋白g</div><div class="hd">脂肪g</div>
        <div class="lab">力训日</div>${qin('q_tc',Q.train.carb)}${qin('q_tp',Q.train.protein)}${qin('q_tf',Q.train.fat)}
        <div class="lab">休息日</div>${qin('q_rc',Q.rest.carb)}${qin('q_rp',Q.rest.protein)}${qin('q_rf',Q.rest.fat)}</div></div>
    <div class="dgroup"><h3>③ 训练动作</h3>
      <div class="subh">核心稳定模块</div><div id="ed_core">${Pl.core.map((e,i)=>exedit('core',i,e[0],e[1])).join('')}</div><button class="addrow" data-add="core">${I.plus} 加一行</button>
      <div class="subh">A · 上肢日</div><div id="ed_A">${Pl.A.map((e,i)=>exedit('A',i,e[0],e[2])).join('')}</div><button class="addrow" data-add="A">${I.plus} 加一行</button>
      <div class="subh">B · 下肢日</div><div id="ed_B">${Pl.B.map((e,i)=>exedit('B',i,e[0],e[2])).join('')}</div><button class="addrow" data-add="B">${I.plus} 加一行</button></div>
    <button class="submit" id="saveDesign">${I.check}<span>保存方案</span></button>`;
  $('#applySug').onclick=()=>{const sg=suggest(readProfile());['q_tc','q_tp','q_tf','q_rc','q_rp','q_rf'].forEach((id,k)=>{$('#'+id).value=[sg.train.carb,sg.train.protein,sg.train.fat,sg.rest.carb,sg.rest.protein,sg.rest.fat][k];});toast('已填入建议配额');};
  document.querySelectorAll('#view-design [data-rm]').forEach(b=>b.onclick=()=>{const[g,i]=b.dataset.rm.split(':');state.cfg.plan[g].splice(+i,1);saveLS(CFGK,state.cfg);renderDesign();});
  document.querySelectorAll('#view-design [data-add]').forEach(b=>b.onclick=()=>{const g=b.dataset.add;collectDesign();state.cfg.plan[g].push(g==='core'?['','']:['','','']);renderDesign();});
  document.querySelectorAll('#view-design .dfield input, #view-design .qedit input').forEach(inp=>inp.onchange=()=>{});
  $('#saveDesign').onclick=async()=>{collectDesign();await saveConfig(state.cfg);toast('方案已保存 · 已同步');renderDesign();};
}
function dfield(l,id,v,type){return `<div class="dfield"><label>${l}</label><input id="${id}" type="${type||'number'}" value="${v}"></div>`;}
function qin(id,v){return `<input id="${id}" type="number" value="${v}">`;}
function exedit(g,i,n,t){return `<div class="exedit"><input class="e1" id="ex_${g}_${i}_n" value="${(n||'').replace(/"/g,'&quot;')}" placeholder="动作名"><input class="e2" id="ex_${g}_${i}_t" value="${(t||'').replace(/"/g,'&quot;')}" placeholder="组×次"><button class="rm" data-rm="${g}:${i}">${I.x}</button></div>`;}
function readProfile(){return {name:state.cfg.profile.name,height:+$('#p_height').value,age:+$('#p_age').value,start_weight:+$('#p_sw').value,target_weight:+$('#p_tw').value,start_date:$('#p_sd').value};}
function collectDesign(){
  state.cfg.profile=readProfile();
  state.cfg.quota={train:{carb:+$('#q_tc').value,protein:+$('#q_tp').value,fat:+$('#q_tf').value},rest:{carb:+$('#q_rc').value,protein:+$('#q_rp').value,fat:+$('#q_rf').value}};
  ['core','A','B'].forEach(g=>{state.cfg.plan[g]=state.cfg.plan[g].map((e,i)=>{const n=$(`#ex_${g}_${i}_n`),t=$(`#ex_${g}_${i}_t`);if(!n)return e;return g==='core'?[n.value,t.value]:[n.value,e[1]||'',t.value];}).filter(e=>e[0]);});
  saveLS(CFGK,state.cfg);
}
function suggest(p){
  const bmr=p.start_weight*9.99+p.height*6.25-p.age*4.92+5,b=bmr/0.7,e1=b+150,e2=b,f1=e1*0.64,f2=e2*0.64;
  const fat=60,prot=Math.round(p.start_weight*1.5/5)*5;
  const ct=Math.max(0,Math.round((f1-fat*9-prot*4)/4/5)*5),cr=Math.max(0,Math.round((f2-fat*9-prot*4)/4/5)*5);
  return {bmr:Math.round(bmr),eat:Math.round(f1),train:{carb:ct,protein:prot,fat},rest:{carb:cr,protein:prot,fat}};
}

/* ============ 角色 / 导航 / toast ============ */
let toastT;
function toast(m){const t=$('#toast');t.innerHTML=`${I.check}<span>${m}</span>`;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2600);}
function setRole(r){state.role=r;saveLS(ROLEK,r);const c=$('#roleChip');c.textContent=r==='coach'?'教练':'用户';c.className='rolechip '+(r==='coach'?'coach':'user');state.view=r==='coach'?'progress':'today';renderNav();renderAll();switchView(state.view);}
$('#gearBtn').onclick=()=>{
  if(state.role==='coach'){setRole('user');toast('已切到 用户模式');return;}
  const pin=prompt('输入教练 PIN 进入设计模式');if(pin===null)return;
  if(pin===CONFIG.COACH_PIN){setRole('coach');toast('已进入 教练模式');}else toast('PIN 不对');
};
function renderAll(){renderToday();renderDiet();renderPlan();renderProgress();if(state.role==='coach')renderDesign();}
function switchView(v){
  state.view=v;document.querySelectorAll('.view').forEach(s=>s.classList.remove('on'));$('#view-'+v).classList.add('on');
  document.querySelectorAll('.tabbar button').forEach(b=>b.classList.toggle('on',b.dataset.tab===v));
  window.scrollTo({top:0});
  if(v==='today')renderToday();else if(v==='diet')renderDiet();else if(v==='plan')renderPlan();else if(v==='progress')renderProgress();else renderDesign();
}

/* ============ 启动 ============ */
(async function(){
  await initData();
  state.cfg=await fetchConfig();
  if(!CLOUD)seedDemo();
  state.rows=await fetchAll();
  setRole(loadLS(ROLEK,'user'));
  if(!CLOUD){const b=document.createElement('div');b.className='demo-banner';b.innerHTML=`${I.spark} 演示模式 · 数据存本机，配置 Supabase 后云同步`;$('#view-today').appendChild(b);}
})();
</script>
